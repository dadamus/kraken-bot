# Home Assistant add-on definition. Paper by default; real orders only with execution: live AND "mode": "live"
# in config.json (see DOCS.md).
name: Kraken CFD paper
version: "0.6.1"
slug: kraken_cfd
description: "Claude calls long / short / flat on bitcoin, gold and crude oil; a simulated CFD account executes them, optionally shadowed on Kraken Derivatives (orders checked, not sent) or live"
url: https://github.com/dadamus/kraken-bot
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8098
panel_icon: mdi:swap-vertical-bold
panel_title: CFD paper
map:
  - addon_config:rw
options:
  anthropic_api_key: ""
  language: en
  run_time: "08:20"
  refresh_minutes: 5
  execution: paper
  kraken_futures_api_key: ""
  kraken_futures_api_secret: ""
  live_smoke_test: false
schema:
  anthropic_api_key: password
  language: list(en|pl)
  run_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  refresh_minutes: int(1,60)
  execution: list(paper|shadow|live)
  kraken_futures_api_key: password?
  kraken_futures_api_secret: password?
  live_smoke_test: bool
