name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r kraken_bot/requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kraken-bot kraken_bot
      - run: docker run --rm kraken-bot python -c "import anthropic, requests, bot"
      - run: docker build -t kraken-cfd kraken_cfd
      - run: docker run --rm -e CFD_DATA_DIR=/tmp/cfd kraken-cfd python cfd_bot.py --offline
      - run: docker build -t kraken-intraday kraken_intraday
      - run: docker run --rm -e INTRADAY_DATA_DIR=/tmp/intraday kraken-intraday python intraday_bot.py --offline
      - run: docker run --rm -e INTRADAY_DATA_DIR=/tmp/intraday kraken-intraday python intraday_bot.py --backtest --offline
