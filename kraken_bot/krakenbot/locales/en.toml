# Kraken bot messages - English.
# Placeholders in {braces} use Python str.format syntax and must match en.toml.
# Keep "model: hold", "STOP", "TAKE-PROFIT" and "STOP-LOSS" unchanged: the log and dashboards rely on them.

# English name of the language: the model is told to write its reasoning in it.
language_name = "English"

# ---- Cycle (console output of the daily run)
cycle_header = "== {now}  {pairs}  mode: {mode}"
price_line = "  {pair:<10} price {price:,.4f} | 1d {d1}% | 7d {d7}% | vs SMA200 {sma200}% | ATR {atr}%"
vs_btc_line = "  {pair:<10} vs BTC: 7d {d7}% | 30d {d30}%"
news_count = "  news: {n}"
offline_news = "(offline) no news"
market_line = "  BTC dominance {btc}% | stablecoins {stable}% | market cap 24h {cap:+}%"
dvol_line = "  {pair:<10} DVOL {dvol} (approx. ±{move}%/day), realized {realized}%"
funding_line = "  {pair:<10} funding {funding:+.4f}%/8h | OI {oi} USD m ({oi_chg}% since last)"
untracked_position = "  WARNING: {pair} holds {coin} but is not in \"pairs\" - the bot does not watch it"
model_summary = "  model: {summary}"
decision_line = "  {pair:<10} model: {action} ({conf:.2f}, {size:.0f}%, p_up_3d {p_up}) -> {side} - {why}"
fill_line = "             [{mode}] {side} {qty:.8f} @ {fill:,.4f}"
