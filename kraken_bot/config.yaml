# Home Assistant add-on definition. See README.md -> "Install as a Home Assistant add-on".
name: Kraken bot
version: "2.10.1"
slug: kraken_bot
description: Experimental Claude-assisted crypto bot for Kraken (paper / live) with hard-coded risk rules
url: https://github.com/dadamus/kraken-bot
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-box-outline
panel_title: Kraken bot
map:
  - addon_config:rw
options:
  anthropic_api_key: ""
  kraken_api_key: ""
  kraken_api_secret: ""
  language: en
  run_time: "08:05"
  ha_refresh_minutes: 15
  stop_check_seconds: 15
  live: false
  entry_prices:
    - pair: XBTEUR
      price: 0
    - pair: ETHEUR
      price: 0
    - pair: SOLEUR
      price: 0
schema:
  anthropic_api_key: password
  kraken_api_key: password?
  kraken_api_secret: password?
  language: list(en|pl)
  run_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  ha_refresh_minutes: int(1,1440)
  stop_check_seconds: int(0,300)?
  live: bool
  entry_prices:
    - pair: str
      price: float(0,)
