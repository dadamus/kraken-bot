configuration:
  anthropic_api_key:
    name: Klucz API Anthropic
    description: Klucz z console.anthropic.com. Używany raz dziennie do oceny rynku.
  kraken_api_key:
    name: Klucz API Kraken
    description: Potrzebny tylko w trybie live. Uprawnienia - Query Funds, Query Open Orders & Trades, Query Closed Orders & Trades, Query Ledger Entries, Create & Modify Orders. Nigdy Withdraw Funds.
  kraken_api_secret:
    name: Sekret API Kraken
    description: Potrzebny tylko w trybie live.
  language:
    name: Język
    description: Język logów, nazw encji w Home Assistant, powiadomień i uzasadnień modelu.
  run_time:
    name: Godzina cyklu
    description: Godzina (HH:MM, czas lokalny) codziennej analizy i handlu.
  ha_refresh_minutes:
    name: Odświeżanie (minuty)
    description: Jak często sprawdzać stop-loss / take-profit na bieżącej cenie i odświeżać encje w Home Assistant. Bez zapytań do modelu.
  stop_check_seconds:
    name: Sprawdzanie stopów (sekundy)
    description: Jak często między odświeżeniami porównywać bieżącą cenę z poziomami stop-loss / take-profit (tylko publiczna cena, bez modelu). Przebity poziom sprzedaje od razu, a nie przy następnym odświeżeniu. 0 = wyłączone.
  live:
    name: Tryb live
    description: Handel na prawdziwym saldzie Krakena. Wymaga też "mode" ustawionego na "live" w config.json. Przy live_validate_only (domyślnie) zlecenia są tylko walidowane.
  entry_prices:
    name: Ceny zakupu
    description: Średnia cena zakupu w EUR za 1 monetę dla monet kupionych poza botem (np. w aplikacji Kraken). Potrzebna do stałego stop-lossa / take-profitu. 0 = nieznana.
