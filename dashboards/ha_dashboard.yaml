# Home Assistant dashboard (English). Paste the WHOLE file:
# Settings -> Dashboards -> (your dashboard) -> pencil -> ⋮ -> Raw configuration editor -> replace everything -> Save.
# "Sections" layout: on a wide screen portfolio | positions and decision, below performance and the log.
# The Polish version is ha_dashboard.pl.yaml.
title: Kraken bot
views:
  - title: Kraken bot
    path: kraken-bot
    icon: mdi:robot
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------------ portfolio
      - type: grid
        cards:
          - type: heading
            heading: Portfolio
            icon: mdi:wallet
            badges:
              - type: entity
                entity: sensor.kraken_bot_equity
                icon: mdi:robot
                state_content: mode
              - type: entity
                entity: sensor.kraken_bot_equity
                icon: mdi:update
                state_content: updated
          - type: tile
            entity: sensor.kraken_bot_equity
            name: Equity
            color: blue
          - type: tile
            entity: sensor.kraken_bot_free_eur
            name: Free EUR
            color: grey
          - type: sensor
            entity: sensor.kraken_bot_return
            name: Return since start
            graph: line
            hours_to_show: 168
            detail: 2
            grid_options:
              columns: full
          - type: tile
            entity: sensor.kraken_bot_performance
            name: 3-day forecast hit rate
            icon: mdi:bullseye-arrow
            color: purple
            grid_options:
              columns: full

      # ------------------------------------------------------------------ positions and decision
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Positions
            icon: mdi:chart-areaspline
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- macro num(x, d=0) -%}{{ ('{:,.' ~ d ~ 'f}').format(x | float(0)).replace(',', ' ') }}{%- endmacro -%}
              {%- macro pct(x) -%}
              {%- if x is none or x == '' -%}–
              {%- elif x | float(0) >= 0 -%}<font color="#2e7d32">▲ {{ '%.2f' | format(x | float) }}%</font>
              {%- else -%}<font color="#c62828">▼ {{ '%.2f' | format(x | float | abs) }}%</font>
              {%- endif -%}
              {%- endmacro -%}
              | | value | position result | price | entry | stop | buy and hold |
              |:--|--:|--:|--:|--:|--:|--:|
              {%- for pair, name in [('xbteur', 'BTC'), ('etheur', 'ETH'), ('soleur', 'SOL')] %}
              {%- set e = 'sensor.kraken_bot_' ~ pair %}
              {%- set coin = state_attr(e, 'coin') | float(0) %}
              {%- set entry = state_attr(e, 'entry_price') %}
              {%- set stop = state_attr(e, 'stop_price') %}
              {%- set price = state_attr(e, 'price') | float(0) %}
              {%- if coin > 0 %}
              | **{{ name }}** | **{{ num(states(e)) }} EUR** | {{ pct(state_attr(e, 'position_pnl_pct')) }} | {{ num(price, 2 if price < 1000 else 0) }} | {{ num(entry, 2 if price < 1000 else 0) if entry else '–' }} | {{ (num(stop, 2 if price < 1000 else 0) ~ ' <small>(' ~ '%.1f' | format((stop / price - 1) * 100) ~ '%)</small>') if stop else '–' }} | {{ pct(state_attr(e, 'buy_and_hold_pct')) }} |
              {%- else %}
              | {{ name }} | <font color="grey">none</font> | | {{ num(price, 2 if price < 1000 else 0) }} | | | {{ pct(state_attr(e, 'buy_and_hold_pct')) }} |
              {%- endif %}
              {%- endfor %}

          - type: heading
            heading: Last decision
            icon: mdi:robot-outline
            badges:
              - type: entity
                entity: sensor.kraken_bot_decision
                icon: mdi:clock-outline
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set d = 'sensor.kraken_bot_decision' %}
              {%- set names = {'XBTEUR': 'BTC', 'ETHEUR': 'ETH', 'SOLEUR': 'SOL'} %}
              {%- set icons = {'buy': '🟢', 'sell': '🔴', 'hold': '⚪', 'stop': '🛑'} %}
              {%- set done = {'buy': '**bought**', 'sell': '**sold**', 'none': 'no change', 'error': '⚠️ **order error**'} %}
              {%- set h = state_attr('sensor.kraken_bot_equity', 'halted_until') %}
              {%- if h %}
              ⚠️ **Trading halted until {{ h[:10] }}** (equity drawdown)

              {% endif %}
              {{ state_attr(d, 'summary') or 'No decision yet - it will appear after the next cycle.' }}
              {% for r in state_attr(d, 'decisions') or [] %}
              ---
              {{ icons.get(r.model_action, '•') }} **{{ names.get(r.pair, r.pair) }}** · {{ r.model_action }}
              · confidence {{ ((r.confidence | float(0)) * 100) | round }}%
              {%- if r.get('p_up_3d') not in (none, '') %} · chance of a rise in 3 days {{ ((r.p_up_3d | float) * 100) | round }}%{% endif %}
              → {{ done.get(r.executed, r.executed) }}

              > {{ r.reasoning }}

              {%- if r.rule and not r.rule.startswith('model: hold') %}

              <font color="grey">rule: {{ r.rule }}</font>
              {%- endif %}
              {% endfor %}

      # ------------------------------------------------------------------ price and forecast
      # Price and forecast charts need the ApexCharts card: HACS -> search "apexcharts-card" -> Download,
      # then reload the browser. Without it only these three cards show an error, the rest works.
      # The forecast is theoretical: the 3-day path implied by the model's "chance of a rise" (p_up_3d) and
      # the current volatility, with a ±1σ band (about 2 in 3 outcomes). 50% = flat line, no view.
      - type: grid
        cards:
          - type: heading
            heading: BTC - price and forecast
            icon: mdi:bitcoin
            badges:
              - type: entity
                entity: sensor.kraken_bot_xbteur_forecast
                icon: mdi:crystal-ball
              - type: entity
                entity: sensor.kraken_bot_xbteur_forecast
                icon: mdi:clock-outline
                state_content: made
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 33d
            span:
              end: day
              offset: +3d
            header:
              show: false
            now:
              show: true
              label: now
            yaxis:
              - decimals: 0
            apex_config:
              chart:
                height: 260
              legend:
                show: true
            series:
              - entity: sensor.kraken_bot_xbteur_forecast
                name: Price
                color: "#1e88e5"
                stroke_width: 2
                show:
                  in_header: false
                data_generator: |
                  const now = Number(hass.states['sensor.kraken_bot_xbteur']?.attributes.price);
                  const history = entity.attributes.history || [];
                  return now ? [...history, [Date.now(), now]] : history;
              - entity: sensor.kraken_bot_xbteur_forecast
                name: Forecast
                color: "#8e24aa"
                stroke_width: 2
                stroke_dash: 4
                show:
                  in_header: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[1]]);
              - entity: sensor.kraken_bot_xbteur_forecast
                name: ±1σ range
                color: "#ce93d8"
                stroke_width: 1
                stroke_dash: 2
                show:
                  in_header: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[2]]);
              - entity: sensor.kraken_bot_xbteur_forecast
                name: ±1σ range
                color: "#ce93d8"
                stroke_width: 1
                stroke_dash: 2
                show:
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[3]]);
              - entity: sensor.kraken_bot_xbteur
                name: Entry
                color: "#2e7d32"
                stroke_width: 1
                stroke_dash: 6
                show:
                  in_header: false
                data_generator: |
                  const v = Number(entity.attributes.entry_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];
              - entity: sensor.kraken_bot_xbteur
                name: Stop
                color: "#c62828"
                stroke_width: 1
                stroke_dash: 6
                show:
                  in_header: false
                data_generator: |
                  const v = Number(entity.attributes.stop_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];

      - type: grid
        cards:
          - type: heading
            heading: ETH - price and forecast
            icon: mdi:ethereum
            badges:
              - type: entity
                entity: sensor.kraken_bot_etheur_forecast
                icon: mdi:crystal-ball
              - type: entity
                entity: sensor.kraken_bot_etheur_forecast
                icon: mdi:clock-outline
                state_content: made
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 33d
            span:
              end: day
              offset: +3d
            header:
              show: false
            now:
              show: true
              label: now
            yaxis:
              - decimals: 0
            apex_config:
              chart:
                height: 260
              legend:
                show: true
            series:
              - entity: sensor.kraken_bot_etheur_forecast
                name: Price
                color: "#1e88e5"
                stroke_width: 2
                show:
                  in_header: false
                data_generator: |
                  const now = Number(hass.states['sensor.kraken_bot_etheur']?.attributes.price);
                  const history = entity.attributes.history || [];
                  return now ? [...history, [Date.now(), now]] : history;
              - entity: sensor.kraken_bot_etheur_forecast
                name: Forecast
                color: "#8e24aa"
                stroke_width: 2
                stroke_dash: 4
                show:
                  in_header: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[1]]);
              - entity: sensor.kraken_bot_etheur_forecast
                name: ±1σ range
                color: "#ce93d8"
                stroke_width: 1
                stroke_dash: 2
                show:
                  in_header: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[2]]);
              - entity: sensor.kraken_bot_etheur_forecast
                name: ±1σ range
                color: "#ce93d8"
                stroke_width: 1
                stroke_dash: 2
                show:
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[3]]);
              - entity: sensor.kraken_bot_etheur
                name: Entry
                color: "#2e7d32"
                stroke_width: 1
                stroke_dash: 6
                show:
                  in_header: false
                data_generator: |
                  const v = Number(entity.attributes.entry_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];
              - entity: sensor.kraken_bot_etheur
                name: Stop
                color: "#c62828"
                stroke_width: 1
                stroke_dash: 6
                show:
                  in_header: false
                data_generator: |
                  const v = Number(entity.attributes.stop_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];

      - type: grid
        cards:
          - type: heading
            heading: SOL - price and forecast
            icon: mdi:alpha-s-circle
            badges:
              - type: entity
                entity: sensor.kraken_bot_soleur_forecast
                icon: mdi:crystal-ball
              - type: entity
                entity: sensor.kraken_bot_soleur_forecast
                icon: mdi:clock-outline
                state_content: made
          - type: custom:apexcharts-card
            grid_options:
