# Dashboard Home Assistant (wersja polska). Wklej CAŁY plik:
# Ustawienia -> Dashboardy -> (dashboard) -> ołówek -> ⋮ -> Edytor kodu (raw) -> zastąp całą zawartość -> Zapisz.
# Układ "sekcje": na szerokim ekranie portfel | pozycje i decyzja, pod spodem skuteczność i dziennik.
# Ustaw w dodatku język "pl", żeby nazwy encji, uzasadnienia i reguły też były po polsku.
title: Kraken bot
views:
  - title: Kraken bot
    path: kraken-bot
    icon: mdi:robot
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------------------------------ portfel
      - type: grid
        cards:
          - type: heading
            heading: Portfel
            icon: mdi:wallet
            badges:
              - type: entity
                entity: sensor.kraken_bot_equity
                icon: mdi:robot
                state_content: mode
              - type: entity
                entity: sensor.kraken_bot_equity
                icon: mdi:update
                state_content: updated
          - type: tile
            entity: sensor.kraken_bot_equity
            name: Kapitał
            color: blue
          - type: tile
            entity: sensor.kraken_bot_free_eur
            name: Wolne EUR
            color: grey
          - type: sensor
            entity: sensor.kraken_bot_return
            name: Wynik od startu
            graph: line
            hours_to_show: 168
            detail: 2
            grid_options:
              columns: full
          - type: tile
            entity: sensor.kraken_bot_performance
            name: Trafność prognoz 3d
            icon: mdi:bullseye-arrow
            color: purple
            grid_options:
              columns: full

      # ------------------------------------------------------------------ pozycje i decyzja
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Pozycje
            icon: mdi:chart-areaspline
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- macro num(x, d=0) -%}{{ ('{:,.' ~ d ~ 'f}').format(x | float(0)).replace(',', ' ') }}{%- endmacro -%}
              {%- macro pct(x) -%}
              {%- if x is none or x == '' -%}–
              {%- elif x | float(0) >= 0 -%}<font color="#2e7d32">▲ {{ '%.2f' | format(x | float) }}%</font>
              {%- else -%}<font color="#c62828">▼ {{ '%.2f' | format(x | float | abs) }}%</font>
              {%- endif -%}
              {%- endmacro -%}
              | | wartość | wynik pozycji | cena | wejście | stop | kup i trzymaj |
              |:--|--:|--:|--:|--:|--:|--:|
              {%- for pair, name in [('xbteur', 'BTC'), ('etheur', 'ETH'), ('soleur', 'SOL')] %}
              {%- set e = 'sensor.kraken_bot_' ~ pair %}
              {%- set coin = state_attr(e, 'coin') | float(0) %}
              {%- set entry = state_attr(e, 'entry_price') %}
              {%- set stop = state_attr(e, 'stop_price') %}
              {%- set price = state_attr(e, 'price') | float(0) %}
              {%- if coin > 0 %}
              | **{{ name }}** | **{{ num(states(e)) }} EUR** | {{ pct(state_attr(e, 'position_pnl_pct')) }} | {{ num(price, 2 if price < 1000 else 0) }} | {{ num(entry, 2 if price < 1000 else 0) if entry else '–' }} | {{ (num(stop, 2 if price < 1000 else 0) ~ ' <small>(' ~ '%.1f' | format((stop / price - 1) * 100) ~ '%)</small>') if stop else '–' }} | {{ pct(state_attr(e, 'buy_and_hold_pct')) }} |
              {%- else %}
              | {{ name }} | <font color="grey">brak</font> | | {{ num(price, 2 if price < 1000 else 0) }} | | | {{ pct(state_attr(e, 'buy_and_hold_pct')) }} |
              {%- endif %}
              {%- endfor %}

          - type: heading
            heading: Ostatnia decyzja
            icon: mdi:robot-outline
            badges:
              - type: entity
                entity: sensor.kraken_bot_decision
                icon: mdi:clock-outline
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set d = 'sensor.kraken_bot_decision' %}
              {%- set names = {'XBTEUR': 'BTC', 'ETHEUR': 'ETH', 'SOLEUR': 'SOL'} %}
              {%- set icons = {'buy': '🟢', 'sell': '🔴', 'hold': '⚪', 'stop': '🛑'} %}
              {%- set done = {'buy': '**kupiono**', 'sell': '**sprzedano**', 'none': 'bez zmian', 'error': '⚠️ **błąd zlecenia**'} %}
              {%- set h = state_attr('sensor.kraken_bot_equity', 'halted_until') %}
              {%- if h %}
              ⚠️ **Handel wstrzymany do {{ h[:10] }}** (spadek kapitału)

              {% endif %}
              {{ state_attr(d, 'summary') or 'Brak decyzji - pojawi się po najbliższym cyklu.' }}
              {% for r in state_attr(d, 'decisions') or [] %}
              ---
              {{ icons.get(r.model_action, '•') }} **{{ names.get(r.pair, r.pair) }}** · {{ r.model_action }}
              · pewność {{ ((r.confidence | float(0)) * 100) | round }}%
              {%- if r.get('p_up_3d') not in (none, '') %} · szansa wzrostu w 3 dni {{ ((r.p_up_3d | float) * 100) | round }}%{% endif %}
              → {{ done.get(r.executed, r.executed) }}

              > {{ r.reasoning }}

              {%- if r.rule and not r.rule.startswith('model: hold') %}

              <font color="grey">reguła: {{ r.rule }}</font>
              {%- endif %}
              {% endfor %}

      # ------------------------------------------------------------------ cena i prognoza
      # Wykresy cen i prognozy wymagają karty ApexCharts: Ustawienia -> Marketplace (HACS przed HA 2026.11) -> "apexcharts-card" ->
      # Pobierz, potem odśwież przeglądarkę. Bez niej tylko te trzy karty pokażą błąd, reszta działa.
      # Prognoza jest teoretyczna: ścieżka na 3 dni wynikająca z "szansy wzrostu" modelu (p_up_3d) i bieżącej
      # zmienności, z pasmem ±1σ (ok. 2 na 3 wyniki). 50% = płaska linia, brak zdania.
      - type: grid
        cards:
          - type: heading
            heading: BTC - cena i prognoza
            icon: mdi:bitcoin
            badges:
              - type: entity
                entity: sensor.kraken_bot_xbteur_forecast
                icon: mdi:crystal-ball
              - type: entity
                entity: sensor.kraken_bot_xbteur_forecast
                icon: mdi:clock-outline
                state_content: made
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 33d
            span:
              end: day
              offset: +3d
            header:
              show: false
            now:
              show: true
              label: teraz
            yaxis:
              - decimals: 0
            apex_config:
              chart:
                height: 260
              legend:
                show: true
            series:
              - entity: sensor.kraken_bot_xbteur_forecast
                name: Cena
                color: "#1e88e5"
                unit: EUR
                extend_to: false
                stroke_width: 2
                show:
                  in_header: false
                data_generator: |
                  const now = Number(hass.states['sensor.kraken_bot_xbteur']?.attributes.price);
                  const history = entity.attributes.history || [];
                  return now ? [...history, [Date.now(), now]] : history;
              - entity: sensor.kraken_bot_xbteur_forecast
                name: Prognoza
                color: "#8e24aa"
                unit: EUR
                extend_to: false
                stroke_width: 2
                stroke_dash: 4
                show:
                  in_header: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[1]]);
              - entity: sensor.kraken_bot_xbteur_forecast
                name: zakres ±1σ
                color: "#ce93d8"
                unit: EUR
                extend_to: false
                stroke_width: 1
                stroke_dash: 2
                show:
                  legend_value: false
                  in_header: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[2]]);
              - entity: sensor.kraken_bot_xbteur_forecast
                name: zakres ±1σ
                color: "#ce93d8"
                unit: EUR
                extend_to: false
                stroke_width: 1
                stroke_dash: 2
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(p => [p[0], p[3]]);
              - entity: sensor.kraken_bot_xbteur
                name: Wejście
                color: "#2e7d32"
                unit: EUR
                stroke_width: 1
                stroke_dash: 6
                show:
                  legend_value: false
                  in_header: false
                data_generator: |
                  const v = Number(entity.attributes.entry_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];
              - entity: sensor.kraken_bot_xbteur
                name: Stop
                color: "#c62828"
                unit: EUR
                stroke_width: 1
                stroke_dash: 6
                show:
                  legend_value: false
                  in_header: false
                data_generator: |
                  const v = Number(entity.attributes.stop_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];

