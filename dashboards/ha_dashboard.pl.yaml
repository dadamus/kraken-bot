                  const v = Number(entity.attributes.stop_price);
                  return v ? [[start.getTime(), v], [end.getTime(), v]] : [];

      - type: grid
        cards:
          - type: heading
            heading: SOL - cena i prognoza
            icon: mdi:alpha-s-circle
            badges:
